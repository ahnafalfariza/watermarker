      "@context": "https://schema.org",
      "@graph": [

          "@type": "WebApplication",

          "url": "https://watermark.app/",
          "description": "Free online watermark tool — add text or logo watermarks to images and PDFs. 100% client-side, files never leave your device.",

          "mainEntity": [
            {
              "@type": "Question",
              "name": "Is it really free?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes, completely free with no limits. No accounts, no subscriptions, no watermarks on your watermarks."
              }
            },
            {
              "@type": "Question",

            },

              }
            },
            {
              "@type": "Question",
              "name": "Can I use my company logo as a watermark?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Switch to Image mode in the editor and upload any PNG, SVG, or WebP logo. Adjust size, opacity, and position just like text watermarks."
              }
            },
            {
              "@type": "Question",
              "name": "Does it work offline?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. After your first visit, the app is cached and works without an internet connection. It's a Progressive Web App you can install on your device."
              }
            },
            {
              "@type": "Question",
              "name": "How is this different from other watermark tools?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Most watermark tools upload your files to their servers. This one doesn't. Your files stay on your device, processing happens in your browser, and there's nothing to sign up for."
