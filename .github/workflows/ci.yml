name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # Browser tests (test/browser) drive PDF export in headless Chromium
      - run: bunx playwright install --with-deps chromium

      - run: bun run lint

      # Build before testing: test/seo.test.js checks dist/ and skips itself without it
      - run: bun run build

      - run: bun run test
